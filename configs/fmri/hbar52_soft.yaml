# Soft pooling, trained from scratch (52x): cross-attention pooling as in hbar52_learned.yaml,
# plus an alignment loss (MSE between the learned and the atlas mean-pooled parcel/network
# features, atlas side without gradient). The soft-alignment weight sigma in the paper is
# loss.lambdas.align_scale (sigma = 2.0 here).
# Same 10-epoch from-scratch recipe as hbar52_fixed.yaml / hbar52_learned.yaml.
# Use with configs/fmri/data.yaml.

model:
  type: "npq_hier_residual"
  token_dim: 192
  bottom_depth: 3
  middle_depth: 2
  top_depth: 1
  num_heads: 8
  n_parcels: 1024
  n_networks: 18

  n_time_tokens_bottom: 8
  n_time_tokens_middle: 8
  n_time_tokens_top: 8
  bottom_temporal_summary: "window_split"
  bottom_encoder_hidden: 64

  bottom_recon_head_layers: 3
  bottom_use_voxel_slots: true
  bottom_use_parcel_cond: true

  cross_scale_mode: "soft"

  bottom_quant_dim: 18
  bottom_group_size: 6

  middle_quant_dim: 12
  middle_group_size: 4

  top_quant_dim: 6
  top_group_size: 3

  bsq_beta: 0.1
  bsq_gamma0: 1.0
  bsq_gamma: 1.0
  bsq_zeta: 1.0
  bsq_l2_norm: true
  bsq_inv_temperature: 1.0
  bsq_persample_entropy_compute: "analytical"

loss:
  lambdas:
    recon: 1.0
    delta: 0.5
    vq: 0.03
    recon_chunk: 10.0
    delta_chunk: 2.0
    recon_parcel: 1.0
    recon_network: 1.0
    align_scale: 2.0   # MSE(learned z_parcel, atlas z_parcel) + MSE(learned z_net, atlas z_net)

train:
  epochs: 10
  batch_size: 4
  num_workers: 4
  lr: 2.0e-4
  weight_decay: 0.01
  use_amp: true
  amp_dtype: "bf16"
  fused_adamw: true
  enable_tf32: true
  matmul_precision: "high"
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 4
  compile: false
  compile_mode: "default"
  compile_fullgraph: false
  chunk_loss_fn: "l1"
  vq_commitment_warmup_steps: 4000
  vq_commitment_start: 0.01
  vq_commitment_end: 0.1
  bsq_entropy_warmup_steps: 4000
  bsq_zeta_start: 0.1
  bsq_zeta_end: 1.0
  grad_accum_steps: 4
  grad_clip_norm: 1.0
  skip_nonfinite_loss: true
  log_interval: 10
  ckpt_every: 1
